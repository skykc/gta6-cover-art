<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio — GTA-style cover maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header>
      <h1>Neon Coast</h1>
      <p class="sub">Cover Studio — turn photos into a GTA VI key-art cover.</p>
    </header>

    <label class="field">Title
      <input id="title" type="text" maxlength="24" value="NEON COAST">
    </label>
    <label class="field">Tagline
      <input id="tagline" type="text" maxlength="40" value="chase the sunset">
    </label>

    <div class="group">
      <span class="group-label">Layout</span>
      <div id="layouts" class="picker"></div>
    </div>

    <div class="group">
      <span class="group-label">Grade</span>
      <div id="grades" class="picker"></div>
    </div>

    <div class="group">
      <span class="group-label">Effects</span>
      <label class="check"><input id="grain" type="checkbox" checked> Grain</label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
      <label class="check"><input id="halftone" type="checkbox"> Halftone</label>
    </div>

    <div class="group">
      <span class="group-label">Photos — pick one, then click a panel</span>
      <label class="upload">Upload photos
        <input id="upload" type="file" accept="image/*" multiple>
      </label>
      <div id="tray" class="tray"></div>
    </div>

    <div class="group">
      <span class="group-label">Selected panel</span>
      <p id="panelLabel" class="panel-label">Panel 1 of 8</p>
      <label class="field">Zoom <span id="zoomVal">100%</span>
        <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1">
      </label>
      <p class="hint">Drag on the cover to pan the photo inside a panel.</p>
    </div>

    <div class="actions">
      <button id="shuffle" type="button">Shuffle photos</button>
      <button id="undo" type="button" disabled>Undo</button>
      <button id="redo" type="button" disabled>Redo</button>
    </div>

    <div class="group">
      <span class="group-label">Export PNG</span>
      <div id="exports" class="exports"></div>
    </div>

    <p id="status" role="status"></p>
  </section>

  <section class="stage" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
